suite_id: "cover_opt_control_ablation_v1"
variants:
  - variant_id: "targeted_valid_patch"
    scenario_path: "../scenarios/small_static.yaml"
    scenario_overrides:
      migration_budget: 0
    initial_heuristic: "latency_first"
    generator: "replay"
    prompt_path: "../prompts/conflict_patch.md"
    replay_file: "../../tests/fixtures/llm/replay_conflict_patch.json"
    features:
      feedback_mode: "conflict_directed"
      repair_actions_enabled: true
      counterexample_memory_enabled: true
      structural_diversity_enabled: true
    budgets: &patch_budget
      max_patch_proposals: 1
      max_evaluator_calls: 2
      max_wall_time_seconds: 10.0
      stop_on_first_feasible: true
    expectation:
      stop_reason: "first_feasible"
      final_feasible: true
      initial_category: "repairable"
      accepted_patches: 1
      rejected_patches: 0
      evaluator_calls: 2
      counterexample_count: 1
      changed_components: ["node_score"]

