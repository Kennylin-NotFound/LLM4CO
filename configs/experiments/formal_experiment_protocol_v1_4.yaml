protocol_id: "cover_opt_holdout_protocol"
version: "1.4.0"
status: "frozen_before_live_call"
frozen_on: "2026-08-25"
evidence_boundaries:
  - "Seeds 200-219 are development diagnostics and are not pooled with this holdout."
  - "Seeds 300-319 are unseen holdout scenarios frozen before v1.4 live calls."
  - "Exact optimality is only claimed inside the enumerated small-instance candidate set."
  - "CurrentPaper-SolverGen remains replay-only and is excluded from live paired claims."
  - "Any v1.4 post-freeze code, prompt, scenario, metric, or budget change requires a new protocol."
final_scenario_contract:
  factory_version: "paired-static-1.1.0"
  base_scenario_path: "../scenarios/small_static.yaml"
  seed_range: [300, 319]
  development_seed_range: [200, 219]
  profile_cycle:
    - "migration_lock"
    - "qos_tight"
    - "joint_constraint"
    - "objective_control"
  perturbation_ranges:
    compute_rate_factor: [0.85, 1.15]
    link_rate_factor: [0.80, 1.20]
    distance_factor: [0.90, 1.10]
    workload_factor: [0.80, 1.20]
    data_factor: [0.80, 1.20]
  qos_calibration: "co_located_sat_b_latency_times_1.05"
  profile_assignment: "profile_cycle[(seed - 300) mod 4]"
  llm_execution_order: "deterministic cyclic rotation by scenario seed and repetition"
stages:
  - stage_id: "offline_control"
    purpose: "control"
    scenario_seeds: [0, 1, 2]
    llm_repetitions: 1
    claim_eligible: false
  - stage_id: "live_pilot"
    purpose: "pilot"
    scenario_seeds: [100, 101, 102, 103, 104]
    llm_repetitions: 1
    claim_eligible: false
  - stage_id: "paired_final"
    purpose: "final"
    scenario_seeds: [300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319]
    llm_repetitions: 3
    claim_eligible: true
live_model_lock:
  live_calls_allowed: true
  provider: "deepseek"
  model_snapshot: "deepseek-v4-pro"
  system_fingerprint: "a307abda487cd1b463329ccb945ce396"
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 2048
  seed_control: "unavailable"
  locked_request_fields:
    - "provider"
    - "model_snapshot"
    - "temperature"
    - "top_p"
    - "max_output_tokens"
    - "prompt_hash"
    - "scenario_hash"
    - "system_fingerprint"
methods:
  - method_id: "random_baseline"
    family: "non_llm"
    implementation_status: "implemented"
    max_llm_calls: 0
    max_evaluator_calls: 4
    max_wall_time_seconds: 30.0
    claim_eligible: false
  - method_id: "latency_greedy"
    family: "non_llm"
    implementation_status: "implemented"
    max_llm_calls: 0
    max_evaluator_calls: 1
    max_wall_time_seconds: 30.0
    claim_eligible: false
  - method_id: "capacity_greedy"
    family: "non_llm"
    implementation_status: "implemented"
    max_llm_calls: 0
    max_evaluator_calls: 1
    max_wall_time_seconds: 30.0
    claim_eligible: false
  - method_id: "exact_enumeration_oracle"
    family: "oracle"
    implementation_status: "implemented"
    max_llm_calls: 0
    max_evaluator_calls: 100000
    max_wall_time_seconds: 30.0
