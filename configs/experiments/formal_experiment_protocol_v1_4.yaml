metrics:
  - metric_id: "feasible_rate"
    direction: "maximize"
    population: "all_cases"
    primary: true
  - metric_id: "weighted_objective"
    direction: "minimize"
    population: "jointly_feasible"
    primary: true
  - metric_id: "candidate_set_gap_pct"
    direction: "minimize"
    population: "jointly_feasible"
    primary: false
  - metric_id: "calls_to_first_feasible"
    direction: "minimize"
    population: "successful_runs"
    primary: false
  - metric_id: "violation_burden"
    direction: "minimize"
    population: "all_cases"
    primary: false
  - metric_id: "schema_failure_rate"
    direction: "minimize"
    population: "all_cases"
    primary: true
  - metric_id: "input_output_tokens"
    direction: "report_only"
    population: "all_cases"
    primary: false
  - metric_id: "wall_time_ms"
    direction: "report_only"
    population: "all_cases"
    primary: false
comparisons:
  - comparison_id: "structured_vs_direct"
    treatment: "structured_llm_plan"
    control: "direct_llm_plan"
    claim_id: "C_SCHEMA"
    required_stage: "paired_final"
    primary_metrics: ["feasible_rate", "schema_failure_rate"]
  - comparison_id: "conflict_vs_generic_feedback"
    treatment: "cover_opt_conflict_feedback"
    control: "cover_opt_generic_feedback"
    claim_id: "C_FEEDBACK"
    required_stage: "paired_final"
    primary_metrics: ["feasible_rate", "calls_to_first_feasible"]
  - comparison_id: "conflict_vs_no_feedback"
    treatment: "cover_opt_conflict_feedback"
    control: "cover_opt_no_feedback"
    claim_id: "C_VERIFICATION"
    required_stage: "paired_final"
    primary_metrics: ["feasible_rate", "violation_burden"]
  - comparison_id: "full_vs_conflict_only"
    treatment: "cover_opt_full"
    control: "cover_opt_conflict_feedback"
    claim_id: "C_PIPELINE"
    required_stage: "paired_final"
    primary_metrics: ["feasible_rate", "weighted_objective"]
statistics:
  paired_by: ["scenario_seed", "model_snapshot"]
  confidence_level: 0.95
  binary_test: "exact McNemar test on paired majority-feasible scenario outcomes"
  continuous_test: "paired Wilcoxon signed-rank test on per-scenario repetition aggregates when sample count permits"
  interval_method: "scenario-cluster paired bootstrap confidence interval with 10000 resamples"
  multiple_comparison_correction: "Holm correction over the four preregistered primary comparisons"
  minimum_paired_scenarios: 20
  report_effect_sizes: true
  inferential_unit: "scenario_seed"
  repetition_aggregation: "mean for continuous metrics; majority across three repetitions for binary feasibility"
  bootstrap_unit: "scenario_seed"
  primary_metric_by_comparison:
    structured_vs_direct: "schema_failure_rate"
    conflict_vs_generic_feedback: "feasible_rate"
    conflict_vs_no_feedback: "violation_burden"
    full_vs_conflict_only: "feasible_rate"
claim_gates:
  - claim_id: "C_SCHEMA"
    comparison_id: "structured_vs_direct"
    required_stage: "paired_final"
    conditions:
      - "Structured output reduces schema-failure rate under the same one-call budget."
      - "Plan feasibility is reported separately so syntax reliability is not conflated with semantics."
    current_status: "planned"
  - claim_id: "C_FEEDBACK"
    comparison_id: "conflict_vs_generic_feedback"
    required_stage: "paired_final"
    conditions:
      - "Conflict-directed feedback improves majority feasible rate under identical iterative budgets."
      - "A negative or null result remains reportable and cannot be replaced post hoc."
    current_status: "planned"
  - claim_id: "C_VERIFICATION"
    comparison_id: "conflict_vs_no_feedback"
    required_stage: "paired_final"
    conditions:
      - "Verifier feedback reduces residual violation burden under paired runs."
      - "No-feedback prompts exclude violations, graph details, and counterexample summaries."
    current_status: "planned"
  - claim_id: "C_PIPELINE"
    comparison_id: "full_vs_conflict_only"
    required_stage: "paired_final"
    conditions:
      - "Outcome rejection and feasibility/objective probes improve majority feasible rate beyond conflict feedback alone."
      - "Weighted objective, evaluator use, and LLM cost are reported even when feasibility improves."
    current_status: "planned"
artifacts:
  required_run_fields:
    - "protocol_hash"
    - "code_hash"
    - "config_hash"
    - "prompt_hash"
    - "scenario_hash"
    - "scenario_seed"
    - "llm_repetition"
    - "provider"
    - "model_snapshot"
    - "request_parameters"
    - "budget"
  required_result_fields:
    - "status"
    - "verification"
    - "objective"
    - "llm_calls"
    - "evaluator_calls"
    - "usage"
    - "wall_time_ms"
    - "stop_reason"
  retain_full_trajectory: true
  exclusion_rules:
    - "Exclude only runs with infrastructure failure before a model response; retain them in a separate failure ledger."
    - "Schema, verifier, timeout, and budget failures are method outcomes and cannot be discarded."
    - "Any post-freeze protocol change creates a new version and invalidates pooling with the old version unless reported separately."
  failed_runs_remain_in_feasibility_denominator: true
