[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-opt"
version = "0.1.0"
description = "Reproducible research implementation of COVER-Opt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.1,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
cover-opt = "cover_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
